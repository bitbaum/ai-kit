# The release a package merged is told to the fleet once its tag exists.
#
# release-notify.yml asks on CI's completion. When a version bump is merged
# by pull request (how ai-kit and chatkit ship), git-release.yml starts on
# that same completion and creates the tag a few seconds later, so the notice
# found no tag and stood down. Publish, which finishes after the tag, cannot
# repeat it: a run started by GITHUB_TOKEN chains no further. ai-kit 1.26,
# 1.27 and 1.28 (12-13 Nov 2026) all reached the fleet only on its six-hourly
# schedule. This file asks again when the tag workflow finishes: by then the
# tag exists. CI -> Verified Git release -> this is three levels, which
# GitHub allows. The step below is release-notify.yml's, byte for byte
# (scripts/packages/test-release-notify.mjs holds them equal); a release the
# first notice already reported is asked twice, and the fleet resolves
# releases itself rather than trusting either notice.
# No checkout or execution of the completed workflow's code: metadata only.
# prettier-ignore
name: Notify Fleet once the release is tagged

on:
  workflow_run:
    workflows: [Verified Git release]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: release-notify
  cancel-in-progress: false

jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve a verified immutable release before requesting reconciliation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          FLEET_TOKEN: ${{ secrets.FLEET_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(gh api "repos/$GH_REPO/contents/package.json?ref=$SHA" --jq .content | base64 --decode)"
          version="$(jq -r .version <<< "$manifest")"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'No stable version; no reconciliation requested.'
            exit 0
          fi
          # Source commits with no matching release tag are not releases.
          if ! tagged="$(gh api "repos/$GH_REPO/commits/v$version" --jq .sha 2>/dev/null)" || [ "$tagged" != "$SHA" ]; then
            echo 'This commit is not the versioned release; no reconciliation requested.'
            exit 0
          fi
          ci="$(gh api "repos/$GH_REPO/actions/runs?head_sha=$SHA&per_page=100" --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and (.event == "push" or .event == "workflow_dispatch"))] | first | .conclusion')"
          if [ "$ci" != success ]; then
            echo 'Release CI is not successful yet; its completion will retry notification.'
            exit 0
          fi
          if [ -z "$FLEET_TOKEN" ]; then
            echo '::error::FLEET_PAT is required to notify Fleet; scheduled reconciliation remains the fallback.'
            exit 1
          fi
          payload="$(jq -n --arg repository "$GH_REPO" --arg version "$version" --arg commit "$SHA" '{event_type:"shared-package-release",client_payload:{repository:$repository,version:$version,commit:$commit}}')"
          GH_TOKEN="$FLEET_TOKEN" gh api --method POST repos/bitbaum/fleet/dispatches --input - <<< "$payload"
          echo "Requested authoritative registry and consumer reconciliation for $GH_REPO v$version ($SHA)." >> "$GITHUB_STEP_SUMMARY"
